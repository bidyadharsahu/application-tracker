<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006EFF"/>
      <stop offset="100%" stop-color="#3A00CA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <clipPath id="rnd"><rect width="64" height="64" rx="14.4" ry="14.4"/></clipPath>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14.4" fill="url(#bg)"/>
  <!-- Shine -->
  <ellipse cx="16" cy="12" rx="30" ry="20" fill="white" opacity="0.07" clip-path="url(#rnd)"/>
  <!-- Briefcase handle -->
  <path d="M24 23 Q24 17 32 17 Q40 17 40 23" fill="none" stroke="rgba(245,248,255,0.88)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Briefcase body shadow -->
  <rect x="11.5" y="24.5" width="42" height="29" rx="4" fill="rgba(0,0,60,0.18)"/>
  <!-- Briefcase body -->
  <rect x="11" y="24" width="42" height="29" rx="4" fill="rgba(245,248,255,0.96)"/>
  <!-- Clasp line -->
  <rect x="13" y="33.5" width="38" height="1.5" fill="rgba(0,85,204,0.18)"/>
  <!-- Clasp knob -->
  <rect x="27.5" y="31" width="9" height="5" rx="2.2" fill="rgba(0,102,255,0.72)"/>
  <!-- Gold badge shadow -->
  <circle cx="45.5" cy="46.5" r="12.5" fill="rgba(0,0,0,0.22)"/>
  <!-- Gold badge -->
  <circle cx="45" cy="46" r="12.5" fill="url(#gold)"/>
  <!-- Badge ring -->
  <circle cx="45" cy="46" r="12.5" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.4"/>
  <!-- ଚ letter on badge -->
  <text x="45" y="52" text-anchor="middle" font-family="FreeSerif,serif" font-weight="700" font-size="13" fill="white">ଚ</text>
</svg>